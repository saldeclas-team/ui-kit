packages:
  - "packages/*"
  - "apps/*"

# Expo / Metro needs a flat node_modules layout. Without this, Metro cannot
# resolve the many @tamagui/* and @storybook/* subpackages that Tamagui and
# Storybook re-export from their entry points.
# NOTE: in pnpm 11 this setting moved out of .npmrc into pnpm-workspace.yaml.
nodeLinker: hoisted

# Auto-install peer deps so contributors do not have to run `pnpm install`
# twice when Storybook / Tamagui add new peers.
autoInstallPeers: true

# The React Native peer-dep graph is noisy; do not fail install on mismatches.
strictPeerDependencies: false

# Supply-chain policy: reject any lockfile entry for a package published
# less than N minutes ago. Protects against yank-and-run attacks where
# malicious versions get published + quickly removed before wide
# detection. Setting is explicit so pnpm version bumps do not silently
# lower our security posture.
#
# Industry references for `minimumReleaseAge`:
#   - pnpm 11 default:              ~10 hours (600 min)
#   - Renovate default:             3 days (4320 min)
#   - socket.dev recommend:         48-72h (2880-4320 min)
#   - Chainguard (security vendor): 7 days (10080 min)
#
# **Ramping up progressively** — we are NOT at 7d yet because the
# current lockfile has recent Storybook Web + Chromatic + Vite install
# packages (2026-07-24) with transitive deps still <72h old. Jumping
# straight to 7d would break `pnpm install --frozen-lockfile` in CI.
#
# Roadmap:
#   1. NOW (2026-07-24): `1440` (24h)   — modest improvement over
#      pnpm's default, still permits the current lockfile.
#   2. After 2026-08-01: bump to `4320` (3d — Renovate default). All
#      Storybook Web / Chromatic install-time packages will have
#      aged past 3 days by then.
#   3. After 2026-08-08 (or the next Expo SDK migration event,
#      whichever is later): bump to `10080` (7d — Chainguard-level).
#      Final target for a library shipping to consumer apps.
#
# To temporarily allow a specific package (e.g. one we vetted
# manually), use `minimumReleaseAgeExclude: [<package-name>]`. Avoid;
# always document why in the commit message + AGENTS.md.
minimumReleaseAge: 1440

# Approve postinstall scripts for known-trusted dependencies.
allowBuilds:
  "@swc/core": true
  esbuild: true
  expo: true
  expo-modules-core: true
  husky: true
  react-native-worklets: true
  unrs-resolver: true
