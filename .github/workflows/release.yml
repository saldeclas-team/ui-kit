name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: # allow manual triggering from the Actions UI

concurrency: release-${{ github.ref }}

# `id-token: write` is REQUIRED for OIDC trusted publishing to npm — it lets
# the runner mint a short-lived OIDC token that npm validates against the
# trusted publisher config registered for `ui-kraken` on npmjs.com. See:
# https://docs.npmjs.com/trusted-publishers
permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  # Safety gate: only skip the release job when ui-kraken is still at the
  # placeholder 0.0.0 (scaffold state). Once we bumped to 0.1.0, we can trust
  # changesets/action to be a no-op if there is nothing new to publish.
  intent:
    name: Detect release intent
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          set -euo pipefail
          version=$(node -p "require('./packages/ui-kraken/package.json').version")
          echo "ui-kraken version in main: ${version}"
          if [[ "${version}" == "0.0.0" ]]; then
            echo "proceed=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::ui-kraken is still at placeholder 0.0.0 — skipping release."
          else
            echo "proceed=true" >> "${GITHUB_OUTPUT}"
          fi

  release:
    name: Version or publish
    needs: intent
    if: needs.intent.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Enable pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm build

      # Trusted Publishing (OIDC) — no NPM_TOKEN needed. npm reads the OIDC
      # token minted by `id-token: write` and validates it against the
      # trusted publisher registered for `ui-kraken` on npmjs.com pointing at
      # (repo: saldeclas-team/ui-kit, workflow: release.yml).
      #
      # The `--provenance` flag is set per-package via `publishConfig` in
      # packages/ui-kraken/package.json, so `changeset publish` picks it up
      # without any extra CLI flag.
      - name: Create Release PR or publish
        uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm changeset version
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
