name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: # allow manual triggering from the Actions UI

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  # Safety gate: only skip the release job when ui-kraken is still at the
  # placeholder 0.0.0 (scaffold state). Once we bumped to 0.1.0, we can trust
  # changesets/action to be a no-op if there is nothing new to publish.
  intent:
    name: Detect release intent
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          set -euo pipefail
          version=$(node -p "require('./packages/ui-kraken/package.json').version")
          echo "ui-kraken version in main: ${version}"
          if [[ "${version}" == "0.0.0" ]]; then
            echo "proceed=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::ui-kraken is still at placeholder 0.0.0 — skipping release."
          else
            echo "proceed=true" >> "${GITHUB_OUTPUT}"
          fi

  release:
    name: Version or publish
    needs: intent
    if: needs.intent.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm build

      - name: Create Release PR or publish
        uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm changeset version
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
