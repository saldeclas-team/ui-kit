name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        # Use a dedicated `test:ci` script instead of forwarding flags through
        # `pnpm test -- --ci --coverage`. The extra `--` gets passed through to
        # jest verbatim, which then treats `--ci --coverage` as positional test
        # name patterns (finds nothing, exits 1).
        run: pnpm --filter ui-kraken test:ci

      - name: Build library
        run: pnpm build
