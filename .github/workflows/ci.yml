name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Enable pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        # Use a dedicated `test:ci` script instead of forwarding flags through
        # `pnpm test -- --ci --coverage`. The extra `--` gets passed through to
        # jest verbatim, which then treats `--ci --coverage` as positional test
        # name patterns (finds nothing, exits 1).
        run: pnpm --filter ui-kraken test:ci

      - name: Upload coverage to Codecov
        # `codecov/codecov-action@v5` reads the `lcov.info` that jest emits
        # under `packages/ui-kraken/coverage/` when `test:ci` runs with
        # `--coverage`. `fail_ci_if_error: true` treats a missing upload as a
        # hard failure — silent coverage drops are worse than a red build.
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/ui-kraken/coverage/lcov.info
          flags: ui-kraken
          fail_ci_if_error: true

      - name: Build library
        run: pnpm build
